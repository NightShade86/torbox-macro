name: Auto Delete Old Torrents

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:  

jobs:
  auto_delete:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run auto-delete script
      run: |
        python torbox_auto_delete.py
      env:
       API_KEY: 3b1e6480-a414-43c2-ad41-01b618fc3a4f
